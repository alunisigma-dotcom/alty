<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALTY — Press Start</title>
<style>
:root{--cyan:#69f5ff;--violet:#a78bfa;--pink:#ff4fd8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05050d;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{background:
 radial-gradient(ellipse at 50% 45%,rgba(75,44,145,.35),transparent 55%),
 linear-gradient(135deg,#070812,#101026 55%,#05050b)}
#scene{position:relative;width:100%;height:100%;display:grid;place-items:center;isolation:isolate}
#scene:before{content:"";position:absolute;inset:-50%;z-index:-2;background:repeating-linear-gradient(transparent 0 3px,rgba(120,160,255,.06) 4px),linear-gradient(90deg,transparent 49.8%,rgba(105,245,255,.1) 50%,transparent 50.2%);transform:perspective(500px) rotateX(58deg) scale(1.6);animation:gridmove 8s linear infinite}
#scene:after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.22) 4px);box-shadow:inset 0 0 130px #000}
@keyframes gridmove{to{background-position:0 90px}}
.corner{position:absolute;top:25px;left:30px;right:30px;display:flex;justify-content:space-between;color:#aab2d6;font-size:11px;letter-spacing:3px;text-transform:uppercase}
.panel{position:relative;width:min(760px,92vw);padding:clamp(25px,5vw,58px);text-align:center;border:1px solid rgba(105,245,255,.35);background:linear-gradient(145deg,rgba(14,18,40,.9),rgba(8,8,20,.84));box-shadow:0 0 35px rgba(105,245,255,.13),inset 0 0 45px rgba(167,139,250,.08);clip-path:polygon(0 18px,18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}
.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:6px;text-transform:uppercase}
h1{margin:12px 0 0;font-size:clamp(68px,15vw,145px);line-height:.95;letter-spacing:.12em;font-weight:1000;text-shadow:3px 0 var(--pink),-3px 0 var(--cyan),0 0 32px rgba(167,139,250,.85);animation:glow 2.2s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.4);text-shadow:5px 0 var(--pink),-5px 0 var(--cyan),0 0 55px #895cff}}
.tagline{margin:18px 0 25px;color:#c6c8e8;letter-spacing:4px;font-size:clamp(10px,2vw,14px)}
.character{width:clamp(115px,22vw,190px);height:clamp(115px,22vw,190px);object-fit:contain;filter:drop-shadow(0 0 20px rgba(105,245,255,.45));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}
button{display:block;margin:24px auto 0;padding:16px 38px;border:1px solid var(--cyan);background:linear-gradient(90deg,rgba(105,245,255,.12),rgba(167,139,250,.2));color:white;font-size:15px;font-weight:800;letter-spacing:5px;cursor:pointer;box-shadow:0 0 22px rgba(105,245,255,.2);transition:.2s}
button:hover,button:focus-visible{outline:none;background:var(--cyan);color:#05050d;transform:scale(1.06);box-shadow:0 0 35px var(--cyan)}
.hint{margin-top:13px;color:#8186aa;font-size:10px;letter-spacing:3px;animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.bottom{position:absolute;bottom:24px;left:30px;right:30px;display:flex;justify-content:space-between;color:#7e83a6;font-size:10px;letter-spacing:2px}
#scene.leaving .panel{animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(1.08);filter:blur(12px)}}
@media(max-width:520px){.corner,.bottom{left:14px;right:14px;font-size:9px}.panel{padding:28px 15px}.tagline{letter-spacing:2px}}
</style>
</head>
<body>
<div id="scene">
  <div class="corner"><span>ALTY.EXE // STARTUP</span><span>PLAYER 01</span></div>
  <main class="panel">
    <div class="eyebrow">A new experience awaits</div>
    <h1>ALTY</h1>
    <p class="tagline">WELCOME TO THE CHAOS</p>
    <img class="character" src="media/images/robalini.gif" alt="Robalini">
    <button id="start" type="button">PRESS START</button>
    <div class="hint">CLICK TO ENTER</div>
  </main>
  <div class="bottom"><span>CREATED BY ALUNI</span><span>CO-OWNER TYSIACZEK</span></div>
</div>
<script>
document.getElementById('start').addEventListener('click',()=>{
  const scene=document.getElementById('scene');
  scene.classList.add('leaving');
  setTimeout(()=>{
    // Notify the parent page to close this intro and begin its own safe effects.
    if(window.parent!==window) window.parent.postMessage({type:'ALTY_INTRO_DONE'},'*');
    else document.body.innerHTML='<div style="display:grid;place-items:center;height:100%;color:white;font:20px Arial">Intro zakończone. Otwórz stronę ALTY, aby przejść dalej.</div>';
  },650);
});
</script>
</body>
</html>
