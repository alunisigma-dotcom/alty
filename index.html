  <script>
    (function () {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const notes = [
        [659.25, 1], [659.25, 1], [659.25, 2],
        [659.25, 1], [659.25, 1], [659.25, 2],
        [659.25, 1], [783.99, 1], [523.25, 1.5], [587.33, 0.5], [659.25, 3],
        [698.46, 1], [698.46, 1], [698.46, 1.5], [698.46, 0.5],
        [698.46, 1], [659.25, 1], [659.25, 1], [659.25, 0.5], [659.25, 0.5],
        [659.25, 1], [587.33, 1], [587.33, 1], [659.25, 1], [587.33, 2], [783.99, 2]
      ];

      let ctx = null;
      let stopped = false;
      let started = false;
      const beatMs = 340;

      function playTone(freq, durationBeats, startTime) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        const sec = (durationBeats * beatMs) / 1000;
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(0.12, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + sec * 0.92);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + sec);
      }

      function playLoop() {
        if (stopped || !ctx) return;
        let t = ctx.currentTime + 0.05;
        let totalMs = 0;
        for (const [freq, beats] of notes) {
          playTone(freq, beats, t);
          t += (beats * beatMs) / 1000;
          totalMs += beats * beatMs;
        }
        setTimeout(playLoop, totalMs);
      }

      function unlockAndPlay() {
        if (stopped || !AudioCtx) return;
        if (!ctx) ctx = new AudioCtx();
        ctx.resume().then(() => {
          if (!started && !stopped) {
            started = true;
            playLoop();
          }
        }).catch(() => {});
      }

      ['pointerdown', 'pointermove', 'mousemove', 'touchstart', 'keydown'].forEach(evt => {
        window.addEventListener(evt, unlockAndPlay, { once: true, passive: true });
      });

      const lobby = document.getElementById('introLobby');
      const loadBtn = document.getElementById('startLoadBtn');
      const loaderBox = document.getElementById('loaderBox');
      const loaderFill = document.getElementById('loaderFill');
      const loaderStatus = document.getElementById('loaderStatus');
      const arena = document.getElementById('appleGameArena');
      const basket = document.getElementById('playerBasket');
      const scoreEl = document.getElementById('appleScore');

      let loadingStarted = false;
      let gameStarted = false;
      let basketMovedActionTriggered = false;
      let score = 0;

      const statusSteps = [
        'Ładowanie świątecznego sadu...',
        'Ustawianie koszyka pod choinką...',
        'Polerowanie jabłuszek...',
        'Odpalanie zimowego klimatu...'
      ];

      function startNineSecondLoader() {
        if (loadingStarted || gameStarted) return;
        loadingStarted = true;
        unlockAndPlay();
        if (lobby) lobby.style.display = 'none';
        if (loaderBox) loaderBox.style.display = 'flex';

        const duration = 9000;
        const startTime = performance.now();

        const timer = setInterval(() => {
          if (stopped) {
            clearInterval(timer);
            return;
          }
          const elapsed = performance.now() - startTime;
          const pct = Math.min(100, Math.round((elapsed / duration) * 100));
          const stepIdx = Math.min(statusSteps.length - 1, Math.floor((pct / 100) * statusSteps.length));
          if (loaderFill) loaderFill.style.width = pct + '%';
          if (loaderStatus) loaderStatus.textContent = `${statusSteps[stepIdx]} ${pct}%`;

          if (elapsed >= duration) {
            clearInterval(timer);
            startAppleGame();
          }
        }, 80);
      }

      function startAppleGame() {
        if (gameStarted || stopped) return;
        gameStarted = true;
        if (loaderBox) loaderBox.style.display = 'none';
        if (arena) arena.style.display = 'block';

        let basketX = window.innerWidth / 2;

        function setBasketPosition(clientX) {
          const minX = 45;
          const maxX = window.innerWidth - 45;
          basketX = Math.max(minX, Math.min(maxX, clientX));
          basket.style.left = basketX + 'px';
          basket.style.transform = 'translateX(-50%)';

          if (!basketMovedActionTriggered) {
            basketMovedActionTriggered = true;
            basket.classList.add('active-action');
            // Tutaj dzieje się akcja przy przesunięciu koszyka:
            window.dispatchEvent(new CustomEvent('basketMovedAction', { detail: { x: basketX } }));
          }
        }

        window.addEventListener('pointermove', (e) => {
          if (!gameStarted || stopped) return;
          setBasketPosition(e.clientX);
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
          if (!gameStarted || stopped) return;
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            setBasketPosition(basketX - 38);
          } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            setBasketPosition(basketX + 38);
          }
        });

        const spawner = setInterval(() => {
          if (!gameStarted || stopped) {
            clearInterval(spawner);
            return;
          }
          const apple = document.createElement('div');
          apple.className = 'falling-apple';
          apple.textContent = Math.random() > 0.2 ? '🍎' : '🍏';
          const ax = 30 + Math.random() * (window.innerWidth - 60);
          let ay = -40;
          const speed = 4 + Math.random() * 4;
          apple.style.left = ax + 'px';
          apple.style.top = ay + 'px';
          arena.appendChild(apple);

          const fallLoop = setInterval(() => {
            if (!gameStarted || stopped) {
              clearInterval(fallLoop);
              apple.remove();
              return;
            }
            ay += speed;
            apple.style.top = ay + 'px';

            const bRect = basket.getBoundingClientRect();
            const aRect = apple.getBoundingClientRect();

            const hitX = aRect.right >= bRect.left && aRect.left <= bRect.right;
            const hitY = aRect.bottom >= bRect.top && aRect.top <= bRect.bottom;

            if (hitX && hitY) {
              score += 1;
              if (scoreEl) scoreEl.textContent = score;
              clearInterval(fallLoop);
              apple.remove();
            } else if (ay > window.innerHeight + 50) {
              clearInterval(fallLoop);
              apple.remove();
            }
          }, 20);
        }, 750);
      }

      if (loadBtn) {
        loadBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          startNineSecondLoader();
        });
      }

      const observer = new MutationObserver(() => {
        if (!document.querySelector('.hello-message')) {
          stopped = true;
          if (ctx) ctx.close().catch(() => {});
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
