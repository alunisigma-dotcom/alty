  <script>
    (function () {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      // Melodia "Jingle Bells" (częstotliwości w Hz i długości w ćwierćnutach)
      const notes = [
        [659.25, 1], [659.25, 1], [659.25, 2],
        [659.25, 1], [659.25, 1], [659.25, 2],
        [659.25, 1], [783.99, 1], [523.25, 1.5], [587.33, 0.5], [659.25, 3],
        [698.46, 1], [698.46, 1], [698.46, 1.5], [698.46, 0.5],
        [698.46, 1], [659.25, 1], [659.25, 1], [659.25, 0.5], [659.25, 0.5],
        [659.25, 1], [587.33, 1], [587.33, 1], [659.25, 1], [587.33, 2], [783.99, 2]
      ];

      let ctx = null;
      let stopped = false;
      const beatMs = 340;

      function playTone(freq, durationBeats, startTime) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);

        const sec = (durationBeats * beatMs) / 1000;
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(0.12, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + sec * 0.92);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + sec);
      }

      function playLoop() {
        if (stopped || !ctx) return;
        let t = ctx.currentTime + 0.05;
        let totalMs = 0;
        for (const [freq, beats] of notes) {
          playTone(freq, beats, t);
          t += (beats * beatMs) / 1000;
          totalMs += beats * beatMs;
        }
        setTimeout(playLoop, totalMs);
      }

      function startXmasMusic() {
        if (stopped || ctx) return;
        ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        playLoop();
      }

      window.addEventListener('pointerdown', startXmasMusic, { once: true });
      window.addEventListener('keydown', startXmasMusic, { once: true });

      const observer = new MutationObserver(() => {
        if (!document.querySelector('.hello-message')) {
          stopped = true;
          if (ctx) ctx.close().catch(() => {});
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
